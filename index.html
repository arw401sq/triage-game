<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>トリアージ演習場 — START法・PAT法トレーニング</title>
<style>
  :root{
    --bg:#12161b;
    --bg-grid:#171c22;
    --panel:#1b2129;
    --panel-alt:#232a33;
    --border:#333c47;
    --text:#eceff2;
    --muted:#8b96a3;
    --accent:#3fb8b3;
    --accent-dim:#2a5f5d;
    --warn:#e0a83d;
    --tag-green:#3fa34d;
    --tag-green-dim:#1e3d24;
    --tag-yellow:#e0b23d;
    --tag-yellow-dim:#4a3c17;
    --tag-red:#d64545;
    --tag-red-dim:#4a1e1e;
    --tag-black:#7d838a;
    --tag-black-dim:#2b2e33;
    --phys-color:#5aa9e6;
    --anat-color:#e08a3f;
    --mech-color:#b07de0;
    --font-jp:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;
    --font-tag:"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(63,184,179,0.06), transparent 40%),
      repeating-linear-gradient(0deg, var(--bg-grid) 0px, var(--bg-grid) 1px, var(--bg) 1px, var(--bg) 28px),
      repeating-linear-gradient(90deg, var(--bg-grid) 0px, var(--bg-grid) 1px, var(--bg) 1px, var(--bg) 28px);
    color:var(--text);
    font-family:var(--font-jp);
    min-height:100vh;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:640px;
    margin:0 auto;
    padding:20px 16px 60px;
  }

  /* ---------- Header ---------- */
  .app-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:1px solid var(--border);
    padding-bottom:14px;
    margin-bottom:22px;
    gap:12px;
  }
  .app-header .brand{
    font-family:var(--font-tag);
    font-size:11px;
    letter-spacing:.14em;
    color:var(--accent);
    margin:0 0 4px;
  }
  .app-header h1{
    font-size:21px;
    margin:0;
    font-weight:700;
    letter-spacing:.02em;
  }
  .ref-btn{
    flex-shrink:0;
    background:transparent;
    border:1px solid var(--border);
    color:var(--muted);
    font-family:var(--font-jp);
    font-size:12.5px;
    padding:8px 12px;
    border-radius:3px;
    cursor:pointer;
    white-space:nowrap;
  }
  .ref-btn:hover{border-color:var(--accent);color:var(--accent);}
  .header-actions{
    display:flex;
    flex-direction:column;
    gap:6px;
    flex-shrink:0;
  }
  .feedback-btn:hover{border-color:var(--tag-yellow);color:var(--tag-yellow);}

  /* ---------- Mode select ---------- */
  .mode-grid{display:flex;flex-direction:column;gap:12px;}
  .mode-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-left:4px solid var(--accent);
    border-radius:2px;
    padding:16px 18px;
    cursor:pointer;
    transition:background .15s, border-color .15s;
    text-align:left;
  }
  .mode-card:hover{background:var(--panel-alt);}
  .mode-card .m-eyebrow{
    font-family:var(--font-tag);
    font-size:10.5px;
    letter-spacing:.12em;
    color:var(--text);
    margin-bottom:6px;
  }
  .mode-card h3{margin:0 0 6px;font-size:16.5px;color:var(--text);}
  .mode-card p{margin:0;color:var(--text);font-size:13.5px;}
  .mode-card.pat{border-left-color:var(--tag-yellow);}
  .mode-card.mix{border-left-color:var(--tag-red);}

  .intro-note{
    color:var(--text);
    font-size:13px;
    margin:-6px 0 20px;
  }

  /* ---------- Game top bar ---------- */
  .game-topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
    font-family:var(--font-tag);
    font-size:12px;
    color:var(--muted);
  }
  .progress-track{
    flex:1;
    height:4px;
    background:var(--panel-alt);
    margin:0 12px;
    border-radius:2px;
    overflow:hidden;
  }
  .progress-fill{height:100%;background:var(--accent);transition:width .3s;}
  .score-pill{white-space:nowrap;}
  .score-pill b{color:var(--text);}
  .endless-badge{
    flex-shrink:0;
    font-family:var(--font-tag);
    font-size:10px;
    letter-spacing:.1em;
    background:var(--accent-dim);
    color:var(--accent);
    padding:3px 7px;
    border-radius:2px;
    margin-right:8px;
  }
  .quit-btn{
    flex-shrink:0;
    background:transparent;
    border:1px solid var(--border);
    color:var(--muted);
    font-family:var(--font-jp);
    font-size:11.5px;
    padding:5px 10px;
    border-radius:3px;
    cursor:pointer;
    margin-left:10px;
    white-space:nowrap;
  }
  .quit-btn:hover{border-color:#ff9b9b;color:#ff9b9b;}

  .timer-wrap{
    height:5px;
    background:var(--panel-alt);
    border-radius:3px;
    overflow:hidden;
    margin-bottom:16px;
  }
  .timer-fill{height:100%;background:var(--warn);width:100%;transition:width 1s linear;}

  /* ---------- Patient card ---------- */
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:3px;
    position:relative;
    overflow:hidden;
  }
  .tab-strip{
    display:flex;
    border-bottom:1px dashed var(--border);
  }
  .tab-strip .tab{
    flex:1;
    text-align:center;
    padding:7px 0;
    font-family:var(--font-tag);
    font-size:10.5px;
    letter-spacing:.08em;
    color:var(--muted);
    background:var(--panel-alt);
    transition:opacity .4s, filter .4s;
  }
  .tab-strip .tab.green{border-top:3px solid var(--tag-green);}
  .tab-strip .tab.yellow{border-top:3px solid var(--tag-yellow);}
  .tab-strip .tab.red{border-top:3px solid var(--tag-red);}
  .tab-strip .tab.black{border-top:3px solid var(--tag-black);}
  .tab-strip .tab.torn{opacity:.22;filter:grayscale(1);}
  .tab-strip .tab.kept{background:var(--panel);color:var(--text);font-weight:700;}

  .card-body{padding:20px 20px 22px;}
  .case-label{
    font-family:var(--font-tag);
    font-size:10.5px;
    letter-spacing:.1em;
    color:var(--muted);
    margin-bottom:10px;
  }
  .vignette{font-size:15px;margin:0 0 16px;}
  .ref-img{display:block;width:100%;max-height:220px;object-fit:cover;border-radius:3px;border:1px solid var(--border);margin:0 0 12px;}
  .recap-box{
    background:var(--panel-alt);
    border-left:3px solid var(--muted);
    border-radius:3px;
    padding:10px 14px;
    margin:0 0 14px;
  }
  .recap-title{
    font-family:var(--font-tag);
    font-size:10.5px;
    letter-spacing:.06em;
    color:var(--muted);
    margin:0 0 5px;
  }
  .recap-text{font-size:13.5px;color:var(--muted);margin:0;line-height:1.6;}

  .patient-board{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:18px;
  }
  .patient-card{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:4px;
    text-align:left;
    background:var(--panel);
    border:1px solid var(--border);
    border-left:4px solid var(--muted);
    border-radius:3px;
    padding:12px;
    cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  .patient-card:hover{background:var(--panel-alt);}
  .patient-card.tag-green{border-left-color:var(--tag-green);}
  .patient-card.tag-yellow{border-left-color:var(--tag-yellow);}
  .patient-card.tag-red{border-left-color:var(--tag-red);}
  .patient-card.tag-black{border-left-color:var(--tag-black);}
  .patient-card.tag-none{border-left-color:var(--muted);}
  .patient-card.selected, .patient-card.done{
    background:var(--panel-alt);
    border-color:var(--border);
    opacity:.6;
    cursor:default;
  }
  .patient-card:disabled{cursor:default;}
  .pc-num{font-family:var(--font-tag);font-size:11px;color:var(--muted);}
  .pc-tagchip{font-size:14px;font-weight:700;}
  .pc-check{font-family:var(--font-tag);font-size:10.5px;color:var(--accent);}
  .patient-card.done .pc-check{color:var(--muted);font-weight:700;}
  @media (max-width:420px){
    .patient-board{grid-template-columns:1fr;}
  }
  .vitals{
    background:var(--panel-alt);
    border-radius:3px;
    padding:12px 14px;
    margin-bottom:18px;
    display:flex;
    flex-direction:column;
    gap:7px;
  }
  .vitals .v-row{
    display:flex;
    justify-content:space-between;
    font-size:13.5px;
  }
  .vitals .v-row .k{color:var(--muted);}
  .vitals .v-row .val{font-weight:700;font-family:var(--font-tag);}
  .findings-title{font-size:12.5px;color:var(--muted);margin:0 0 8px;}
  .findings-list{margin:0 0 18px;padding-left:20px;font-size:14px;}
  .findings-list li{margin-bottom:4px;}

  .answer-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .answer-grid.pat{grid-template-columns:1fr 1fr;}
  .ans-btn{
    border:1px solid var(--border);
    background:var(--panel-alt);
    color:var(--text);
    padding:14px 8px;
    border-radius:3px;
    font-family:var(--font-jp);
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
    text-align:center;
    transition:transform .1s, border-color .15s;
  }
  .ans-btn:hover{transform:translateY(-1px);}
  .ans-btn .en{
    display:block;
    font-family:var(--font-tag);
    font-size:9.5px;
    font-weight:400;
    letter-spacing:.1em;
    margin-top:3px;
    opacity:.7;
  }
  .ans-btn.c-green{border-left:4px solid var(--tag-green);}
  .ans-btn.c-yellow{border-left:4px solid var(--tag-yellow);}
  .ans-btn.c-red{border-left:4px solid var(--tag-red);}
  .ans-btn.c-black{border-left:4px solid var(--tag-black);}
  .ans-btn:disabled{cursor:default;opacity:.5;transform:none;}

  .crit-group-title{
    font-family:var(--font-tag);
    font-size:11px;
    letter-spacing:.06em;
    color:var(--muted);
    margin:16px 0 8px;
  }
  .crit-group-title:first-child{margin-top:0;}
  .crit-list{display:flex;flex-direction:column;gap:8px;}
  .crit-btn{
    display:block;
    width:100%;
    text-align:left;
    background:var(--panel-alt);
    border:1px solid var(--border);
    border-left:3px solid var(--accent);
    color:var(--text);
    padding:11px 14px;
    border-radius:3px;
    font-family:var(--font-jp);
    font-size:13.5px;
    line-height:1.5;
    cursor:pointer;
    transition:transform .1s, background .15s;
  }
  .crit-btn:hover{transform:translateX(2px);background:var(--panel);}
  .crit-btn.none-btn{
    display:block;
    width:100%;
    margin-top:16px;
    border-left:3px solid var(--tag-yellow);
    font-weight:700;
    text-align:center;
  }
  .multi-submit-btn{margin-top:16px;}

  /* ---------- Feedback ---------- */
  .feedback{
    margin-top:18px;
    padding-top:16px;
    border-top:1px dashed var(--border);
  }
  .verdict{
    display:inline-block;
    font-family:var(--font-tag);
    font-size:12px;
    letter-spacing:.1em;
    padding:4px 10px;
    border-radius:2px;
    margin-bottom:10px;
  }
  .verdict.ok{background:var(--accent-dim);color:var(--accent);}
  .verdict.ng{background:var(--tag-red-dim);color:#ff9b9b;}

  .stamp{
    display:inline-block;
    transform:rotate(-3deg);
    border:3px solid var(--stamp-color, var(--accent));
    color:var(--stamp-color, var(--accent));
    padding:6px 16px;
    border-radius:6px;
    font-family:var(--font-tag);
    font-weight:700;
    letter-spacing:.1em;
    font-size:15px;
    margin-bottom:12px;
  }
  .explain{font-size:14px;color:var(--text);margin:0 0 18px;}
  .explain b{color:var(--accent);}

  .path-title{
    font-family:var(--font-tag);
    font-size:11px;
    letter-spacing:.06em;
    color:var(--muted);
    margin:4px 0 8px;
  }
  .path-trail{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:2px;
    margin:0 0 18px;
    background:var(--panel-alt);
    border-radius:3px;
    padding:12px 14px;
  }
  .path-step{
    font-size:13px;
    color:var(--text);
    padding:2px 0;
  }
  .path-step.path-alert{
    font-weight:700;
    padding:2px 8px;
    border-radius:3px;
    margin:1px 0;
  }
  .path-alert.tag-green{background:var(--tag-green-dim);color:var(--tag-green);}
  .path-alert.tag-yellow{background:var(--tag-yellow-dim);color:var(--tag-yellow);}
  .path-alert.tag-red{background:var(--tag-red-dim);color:var(--tag-red);}
  .path-alert.tag-black{background:var(--tag-black-dim);color:var(--tag-black);}
  .path-arrow{
    color:var(--muted);
    font-size:12px;
    line-height:1;
    padding-left:2px;
  }
  .path-final{
    font-family:var(--font-tag);
    font-weight:700;
    font-size:13.5px;
    padding:3px 10px;
    border-radius:3px;
    margin-top:2px;
  }
  .path-final.tag-green{background:var(--tag-green-dim);color:var(--tag-green);}
  .path-final.tag-yellow{background:var(--tag-yellow-dim);color:var(--tag-yellow);}
  .path-final.tag-red{background:var(--tag-red-dim);color:var(--tag-red);}
  .path-final.tag-black{background:var(--tag-black-dim);color:var(--tag-black);}

  .next-btn{
    width:100%;
    background:var(--accent);
    color:#0d1418;
    border:none;
    padding:13px;
    font-family:var(--font-jp);
    font-weight:700;
    font-size:14.5px;
    border-radius:3px;
    cursor:pointer;
  }
  .next-btn:hover{filter:brightness(1.08);}

  /* ---------- Result screen ---------- */
  .result-hero{
    text-align:center;
    padding:26px 10px 10px;
  }
  .result-hero .big-score{
    font-family:var(--font-tag);
    font-size:52px;
    font-weight:700;
    line-height:1;
  }
  .result-hero .big-score span{font-size:22px;color:var(--muted);}
  .result-tier{
    font-size:15.5px;
    font-weight:700;
    color:var(--accent);
    margin:8px 0 2px;
  }
  .result-msg{color:var(--muted);font-size:13.5px;margin:0 0 22px;}
  .review-item{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:3px;
    padding:12px 14px;
    margin-bottom:10px;
    font-size:13px;
  }
  .review-item .ri-top{
    display:flex;
    justify-content:space-between;
    font-family:var(--font-tag);
    font-size:11px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .result-actions{display:flex;gap:10px;margin-top:18px;}
  .result-actions button{flex:1;}
  .btn-secondary{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text);
    padding:13px;
    font-family:var(--font-jp);
    font-weight:700;
    font-size:14px;
    border-radius:3px;
    cursor:pointer;
  }

  /* ---------- Reference modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(8,10,13,.72);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:50;
  }
  .modal-sheet{
    background:var(--panel);
    border:1px solid var(--border);
    border-bottom:none;
    border-radius:8px 8px 0 0;
    max-width:640px;width:100%;
    max-height:82vh;
    overflow-y:auto;
    padding:20px 20px 28px;
  }
  .modal-sheet h2{margin:0 0 4px;font-size:17px;}
  .modal-sheet .sub{color:var(--muted);font-size:12.5px;margin-bottom:16px;}
  .modal-close{
    display:block;margin-left:auto;
    background:none;border:none;color:var(--muted);
    font-size:13px;cursor:pointer;padding:6px 0;
  }
  .flow-step{
    display:flex;gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--border);
    font-size:13.5px;
  }
  .flow-step:last-child{border-bottom:none;}
  .flow-step .fs-num{
    flex-shrink:0;
    width:22px;height:22px;border-radius:50%;
    background:var(--panel-alt);
    color:var(--accent);
    font-family:var(--font-tag);
    font-size:12px;
    display:flex;align-items:center;justify-content:center;
  }
  .flow-step .fs-body b{display:block;margin-bottom:2px;}
  .flow-step .fs-body .arrow{color:var(--muted);font-size:12.5px;}
  .tag-chip{
    display:inline-block;
    font-family:var(--font-tag);
    font-size:11px;
    padding:2px 7px;
    border-radius:2px;
    font-weight:700;
  }
  .tag-chip.green{background:var(--tag-green-dim);color:var(--tag-green);}
  .tag-chip.yellow{background:var(--tag-yellow-dim);color:var(--tag-yellow);}
  .tag-chip.red{background:var(--tag-red-dim);color:var(--tag-red);}
  .tag-chip.black{background:var(--tag-black-dim);color:var(--tag-black);}

  .pat-rule{
    background:var(--panel-alt);
    border-radius:3px;
    padding:12px 14px;
    margin-top:14px;
    font-size:13px;
  }
  .pat-rule ul{margin:6px 0 0;padding-left:18px;}
  .pat-rule li{margin-bottom:4px;}

  @media (max-width:400px){
    .result-hero .big-score{font-size:42px;}
    .answer-grid{grid-template-columns:1fr 1fr;}
  }
  /* ---------- Sort-into-zones interaction (2次トリアージ回答UI) ---------- */
  .sort-instruction{font-size:12.5px;color:var(--muted);margin:0 0 12px;}
  .held-banner{
    position:sticky; top:0; z-index:5;
    background:var(--accent); color:#0d1418;
    font-size:13px; font-weight:700;
    padding:9px 12px; border-radius:4px;
    margin-bottom:12px;
    display:none;
  }
  .held-banner.active{display:block;}
  .seg-vignette{cursor:default;}
  .seg{cursor:pointer;padding:1px 1px;border-radius:3px;}
  .seg:hover{background:var(--panel-alt);}
  .seg.picked{background:var(--accent-dim);color:var(--accent);font-weight:700;outline:1px solid var(--accent);}
  .seg.assigned-phys{border-bottom:3px solid var(--phys-color, #5aa9e6);}
  .seg.assigned-anat{border-bottom:3px solid var(--anat-color, #e08a3f);}
  .seg.assigned-mech{border-bottom:3px solid var(--mech-color, #b07de0);}
  .seg-sep{color:var(--muted);}

  .drop-zone{
    background:var(--panel);
    border:2px dashed var(--border);
    border-radius:4px;
    padding:11px 14px;
    margin-bottom:10px;
    min-height:44px;
    transition:border-color .15s, background .15s;
  }
  .drop-zone.targetable{border-color:var(--accent);background:var(--accent-dim);}
  .drop-zone.phys{border-top:4px solid var(--phys-color, #5aa9e6);}
  .drop-zone.anat{border-top:4px solid var(--anat-color, #e08a3f);}
  .drop-zone.mech{border-top:4px solid var(--mech-color, #b07de0);}
  .drop-zone .zone-title{font-family:var(--font-tag);font-size:11px;letter-spacing:.06em;margin:0 0 6px;}
  .drop-zone.phys .zone-title{color:var(--phys-color, #5aa9e6);}
  .drop-zone.anat .zone-title{color:var(--anat-color, #e08a3f);}
  .drop-zone.mech .zone-title{color:var(--mech-color, #b07de0);}
  .zone-empty{color:var(--muted);font-size:12.5px;}
  .zone-chip{
    display:inline-block;
    background:var(--panel-alt);
    border:1px solid var(--border);
    border-radius:3px;
    padding:6px 9px;
    font-size:13px;
    margin:2px 4px 2px 0;
    cursor:pointer;
  }
  .drop-zone.phys .zone-chip{border-left:3px solid var(--phys-color, #5aa9e6);}
  .drop-zone.anat .zone-chip{border-left:3px solid var(--anat-color, #e08a3f);}
  .drop-zone.mech .zone-chip{border-left:3px solid var(--mech-color, #b07de0);}
  .sort-submit-btn{margin-top:8px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================= DATA ============================= */

const START_CASES = [
  {

const SCENARIO_POOLS = {
  "scenario-train": TRAIN_SCENARIO_CASES,
  "scenario-building": BUILDING_SCENARIO_CASES,
  "scenario-stabbing": STABBING_SCENARIO_CASES,
  "scenario-cinema": CINEMA_SCENARIO_CASES,
  "scenario-sportvenue": SPORTVENUE_SCENARIO_CASES
};

function isScenarioMode(mode){
  return mode === "scenario-train" || mode === "scenario-building" || mode === "scenario-stabbing"
    || mode === "scenario-cinema" || mode === "scenario-sportvenue";
}

const TAGS = {
  green:{label:"緑",num:"区分Ⅲ",tier:"軽処置群"},
  yellow:{label:"黄",num:"区分Ⅱ",tier:"非緊急治療群"},
  red:{label:"赤",num:"区分Ⅰ",tier:"最優先治療群"},
  black:{label:"黒",num:"区分0",tier:"死亡・救命困難群"}
};

const PAT_SAMPLE_SIZE = 5;
const START_SAMPLE_SIZE = 16;

function patTag(c){ return c.correct === NONE_KEY ? "yellow" : "red"; }

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* ============================= STATE ============================= */

const state = {
  screen: "select",   // select | game | result
  mode: null,          // start | pat | mix | start-endless | pat-endless | scenario
  endless: false,
  endlessSource: null, // "start" | "pat" — which pool to keep refilling from
  cases: [],
  index: 0,
  score: 0,
  answered: false,
  selected: null,
  mistakes: [],
  timerId: null,
  timeLeft: 20,
  showRef: false,
  showQuit: false,
  currentOptions: null,   // shuffled answer options for the current anat case
  sortAssign: {},         // sentence index -> "phys"|"anat"|"mech"|null, for the sort-into-zones interaction
  sortHeld: null,         // sentence index currently "picked up", or null
  patPending: {phys:null, anat:null, mech:null}, // accumulated answers for the current PAT patient triplet
  lastTripletResult: null, // combined result shown after all 3 PAT stages are answered
  // --- scenario challenge state ---
  scenarioPhase: null,    // triage1 | board | triage2 | triage2none | review
  scenarioPatients: [],
  currentPatientIdx: 0,
  activePatientIdx: null, // patient currently being examined in triage2 / triage2none
  triage2Stage: "phys",   // phys | anat | mech — which of the 3 stages is active for triage2
  reviewIdx: 0,
  scenarioLock: false
};

function quitSession(){
  clearInterval(state.timerId);
  state.showQuit = false;
  state.screen = "result";
  render();
}

function buildPatPool(){
  const patients = shuffle(PAT_COMPOUND_CASES);
  const total = patients.length;
  return patients.map((p, i)=>({
    kind: "pat",
    vignette: p.vignette,
    evidenceIdx: p.evidenceIdx,
    phys: p.phys, anat: p.anat, mech: p.mech,
    compoundNum: i + 1,
    compoundTotal: total
  }));
}

function freshShuffledBatch(source){
  return source === "start"
    ? shuffle(START_CASES).map(c=>({...c, kind:"start"}))
    : buildPatPool();
}

function buildScenarioPatients(pool){
  return shuffle(pool).map((p, i)=>({
    ...p,
    patientNum: i + 1,
    playerTag1: null,
    selectedForStage2: false,
    playerAnswer2: null
  }));
}

function startMode(mode){
  state.mode = mode;
  state.endless = (mode === "start-endless" || mode === "pat-endless");
  state.endlessSource = mode === "start-endless" ? "start" : mode === "pat-endless" ? "pat" : null;
  state.score = 0;
  state.mistakes = [];
  state.screen = "game";

  if(isScenarioMode(mode)){
    state.scenarioPatients = buildScenarioPatients(SCENARIO_POOLS[mode]);
    state.scenarioPhase = "triage1";
    state.currentPatientIdx = 0;
    state.activePatientIdx = null;
    state.reviewIdx = 0;
    render();
    startTimer();
    return;
  }

  if(mode === "start" || mode === "start-endless"){
    const pool = shuffle(START_CASES).map(c=>({...c, kind:"start"}));
    state.cases = mode === "start-endless" ? pool : pool.slice(0, START_SAMPLE_SIZE);
  } else if(mode === "pat" || mode === "pat-endless"){
    const pool = buildPatPool();
    state.cases = mode === "pat-endless" ? pool : pool.slice(0, PAT_SAMPLE_SIZE);
  } else {
    const mixed = [...START_CASES.map(c=>({...c,kind:"start"})), ...buildPatPool()];
    state.cases = shuffle(mixed).slice(0,10);
  }
  state.index = 0;
  loadCaseOptions();
  render();
  if(currentCase().kind === "start") startTimer();
}

function currentCase(){ return state.cases[state.index]; }

function splitSentences(text){
  return text.split("。").filter(s=>s.length>0);
}

function resetSortState(){
  state.sortAssign = {};
  state.sortHeld = null;
}

function loadCaseOptions(){
  resetSortState();
}

function startTimer(){
  clearInterval(state.timerId);
  state.timeLeft = 20;
  state.timerId = setInterval(()=>{
    state.timeLeft -= 1;
    if(state.timeLeft <= 0){
      clearInterval(state.timerId);
      if(isScenarioMode(state.mode) && state.scenarioPhase === "triage1"){
        answerTriage1(null);
      } else if(!state.answered){
        selectAnswer(null);
      }
    }
    updateTimerBar();
  }, 1000);
}

function updateTimerBar(){
  const el = document.getElementById("timer-fill");
  if(el) el.style.width = Math.max(0,(state.timeLeft/20*100)) + "%";
}

function labelForKey(sub, key){
  if(key === NONE_KEY) return NONE_LABEL;
  return sub === "phys" ? PHYS_LABELS[key] : key;
}

function isSortCorrect(placed, correctIdx){
  if(correctIdx.length === 0) return placed.length === 0;
  return placed.length > 0 && placed.every(i => correctIdx.includes(i));
}

function pickUpSentence(i){
  if(state.answered) return;
  state.sortHeld = (state.sortHeld === i) ? null : i;
  render();
}

function placeSentence(zoneKeyOrNull){
  if(state.answered || state.sortHeld === null) return;
  state.sortAssign[state.sortHeld] = zoneKeyOrNull;
  state.sortHeld = null;
  render();
}

function gradeSortedCategories(c, zones){
  const sentences = splitSentences(c.vignette);
  return zones.map(cat=>{
    const placed = Object.keys(state.sortAssign)
      .filter(i=>state.sortAssign[i]===cat)
      .map(Number).sort((a,b)=>a-b);
    const correctIdx = [...c.evidenceIdx[cat]].sort((a,b)=>a-b);
    const correct = isSortCorrect(placed, correctIdx);
    const correctLabel = labelForKey(cat, c[cat].correct);
    const chosenText = placed.length ? placed.map(i=>sentences[i]).join("。") : "（未選択＝該当なしとして回答）";
    return {sub:cat, correct, correctLabel, chosenText, explain:c[cat].explain, placed};
  });
}

function submitPatSort(){
  if(state.answered) return;
  const c = currentCase();
  const results = gradeSortedCategories(c, PAT_STAGE_ORDER);
  state.lastTripletResult = results.map(r=>{
    if(r.correct) state.score += 1;
    else state.mistakes.push({vignette:c.vignette, correctLabel:r.correctLabel, chosenLabel:r.chosenText, explain:r.explain});
    return r;
  });
  state.answered = true;
  render();
}

function selectAnswer(value){
  if(state.answered) return;
  clearInterval(state.timerId);
  const c = currentCase();

  state.answered = true;
  state.selected = value;
  const correct = value === c.tag;
  const correctLabel = TAGS[c.tag].label + "タグ";
  const chosenLabel = value ? TAGS[value].label + "タグ" : "時間切れ";
  if(correct) state.score += 1;
  else state.mistakes.push({vignette:c.vignette, correctLabel, chosenLabel, explain:c.explain});
  render();
}

function nextCase(){
  state.index += 1;
  state.answered = false;
  state.selected = null;
  if(state.index >= state.cases.length){
    if(state.endless){
      state.cases = state.cases.concat(freshShuffledBatch(state.endlessSource));
    } else {
      state.screen = "result";
      render();
      return;
    }
  }
  loadCaseOptions();
  render();
  if(currentCase().kind === "start") startTimer();
}

/* ============================= SCENARIO CHALLENGE ============================= */

function answerTriage1(tag){
  if(state.scenarioLock) return;
  state.scenarioLock = true;
  clearInterval(state.timerId);
  const p = state.scenarioPatients[state.currentPatientIdx];
  p.playerTag1 = tag;
  state.currentPatientIdx += 1;
  if(state.currentPatientIdx >= state.scenarioPatients.length){
    state.scenarioPhase = "board";
  }
  render();
  state.scenarioLock = false;
  if(state.scenarioPhase === "triage1") startTimer();
}

const PAT_STAGE_ORDER = ["phys","anat","mech"];
const PAT_STAGE_LABELS = {phys:"生理学的評価", anat:"解剖学的評価", mech:"受傷機転"};

function stagesFor(p){
  return (p.secondary && p.secondary.stages) ? p.secondary.stages : PAT_STAGE_ORDER;
}

function tapPatient(idx){
  const p = state.scenarioPatients[idx];
  if(p.selectedForStage2) return; // already handled
  state.activePatientIdx = idx;
  if(p.secondary){
    state.scenarioPhase = "triage2";
    resetSortState();
  } else {
    state.scenarioPhase = "triage2none";
  }
  render();
}

function submitScenarioSort(){
  if(state.scenarioLock) return;
  state.scenarioLock = true;
  const p = state.scenarioPatients[state.activePatientIdx];
  const zones = stagesFor(p);
  const answer2 = {phys:[], anat:[], mech:[]};
  zones.forEach(z=>{
    answer2[z] = Object.keys(state.sortAssign)
      .filter(i=>state.sortAssign[i]===z)
      .map(Number).sort((a,b)=>a-b);
  });
  p.playerAnswer2 = answer2;
  p.selectedForStage2 = true;
  state.scenarioPhase = "board";
  render();
  state.scenarioLock = false;
}

function acknowledgeNoSecondary(){
  const p = state.scenarioPatients[state.activePatientIdx];
  p.selectedForStage2 = true;
  p.playerAnswer2 = null;
  state.scenarioPhase = "board";
  render();
}

function enterReview(){
  state.score = 0;
  state.mistakes = [];
  state.scenarioPatients.forEach(p=>{
    if(p.playerTag1 === p.tag){
      state.score += 1;
    } else {
      state.mistakes.push({
        vignette: `【患者${p.patientNum}・一次トリアージ】${p.stage1Vignette}`,
        correctLabel: TAGS[p.tag].label + "タグ",
        chosenLabel: p.playerTag1 ? TAGS[p.playerTag1].label + "タグ" : "時間切れ・未回答",
        explain: p.explain
      });
    }
    if(p.secondary){
      const sentences = splitSentences(p.secondary.vignette);
      stagesFor(p).forEach(cat=>{
        const correctIdx = [...p.secondary.evidenceIdx[cat]].sort((a,b)=>a-b);
        const correctLabel = labelForKey(cat, p.secondary[cat].correct);
        if(p.selectedForStage2 && p.playerAnswer2){
          const placed = [...(p.playerAnswer2[cat]||[])].sort((a,b)=>a-b);
          const correct = isSortCorrect(placed, correctIdx);
          const chosenText = placed.length ? placed.map(i=>sentences[i]).join("。") : "（未選択＝該当なしとして回答）";
          if(correct){
            state.score += 1;
          } else {
            state.mistakes.push({
              vignette: `【患者${p.patientNum}・二次トリアージ／${PAT_STAGE_LABELS[cat]}】${p.secondary.vignette}`,
              correctLabel,
              chosenLabel: chosenText,
              explain: p.secondary[cat].explain
            });
          }
        } else {
          state.mistakes.push({
            vignette: `【患者${p.patientNum}・二次トリアージ／${PAT_STAGE_LABELS[cat]}】${p.secondary.vignette}`,
            correctLabel,
            chosenLabel: "二次トリアージを実施しなかった",
            explain: "この患者は本来、二次トリアージが必要でした。" + p.secondary[cat].explain
          });
        }
      });
    }
  });
  state.scenarioPhase = "review";
  state.reviewIdx = 0;
  render();
}

function backToSelect(){
  clearInterval(state.timerId);
  state.screen = "select";
  render();
}

/* ============================= RENDER ============================= */

function el(html){
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content;
}

function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  app.appendChild(el(renderHeader()));
  if(state.screen === "select") app.appendChild(el(renderSelect()));
  if(state.screen === "game") app.appendChild(el(renderGame()));
  if(state.screen === "result") app.appendChild(el(renderResult()));
  if(state.showRef) app.appendChild(el(renderRefModal()));
  if(state.showQuit) app.appendChild(el(renderQuitModal()));
  bindEvents();
  if(state.screen === "game") updateTimerBar();
}

      <p class="m-eyebrow">シナリオ・患者${SPORTVENUE_SCENARIO_CASES.length}人（架空の事案）</p>
      <h3>シナリオチャレンジ：国際大会爆発事故</h3>
      <p>架空の国際スポーツ大会の会場で発生した爆発事故を想定したシナリオです。爆傷を中心に評価します。実在の事件とは関係のない、教育用の架空設定です。</p>
    </button>
  </div>`;
}

function renderSortInterface(vignetteText, zones, submitBtnId, submitLabel){
  const sentences = splitSentences(vignetteText);
  const heldIdx = state.sortHeld;
  const heldSentence = heldIdx!==null ? sentences[heldIdx] : null;

  const vignetteHtml = sentences.map((s,i)=>{
    const zone = state.sortAssign[i];
    const cls = ["seg"];
    if(heldIdx===i) cls.push("picked");
    if(zone) cls.push("assigned-"+zone);
    return `<span class="${cls.join(' ')}" data-i="${i}">${s}</span>`;
  }).join('<span class="seg-sep">。</span>') + '。';

  const zonesHtml = zones.map(z=>{
    const idxs = sentences.map((_,i)=>i).filter(i=>state.sortAssign[i]===z);
    const chips = idxs.length
      ? idxs.map(i=>`<span class="zone-chip" data-i="${i}">${sentences[i]}</span>`).join("")
      : `<span class="zone-empty">（未割り当て＝該当なし）</span>`;
    const targetable = heldIdx!==null ? "targetable" : "";
    return `<div class="drop-zone ${z} ${targetable}" data-zone="${z}">
      <p class="zone-title">${PAT_STAGE_LABELS[z]}</p>
      <div>${chips}</div>
    </div>`;
  }).join("");

  return `
    <p class="sort-instruction">文をタップすると保持され、続けて振り分け先の枠（または本文の余白）をタップすると移動します。枠に何も割り当てなければ「該当なし」の回答になります。</p>
    <div class="held-banner ${heldSentence?'active':''}">「${heldSentence||''}」を保持中 → 移動先の枠をタップ</div>
    <p class="vignette seg-vignette" id="sort-vignette">${vignetteHtml}</p>
    ${zonesHtml}
    <button class="next-btn sort-submit-btn" id="${submitBtnId}">${submitLabel}</button>
  `;
}

function renderScenarioPatientReviewCard(p){
  const correct1 = p.playerTag1 === p.tag;

  if(p.secondary){
    const sentences = splitSentences(p.secondary.vignette);
    secondaryHtml = `<div style="border-top:1px dashed var(--border);padding-top:12px;margin-top:16px;">
      <p class="path-title">二次トリアージ</p>
      ${refImageHtml(p)}

    PAT_STAGE_ORDER.filter(cat => stagesFor(p).includes(cat)).forEach(cat=>{
      const correctIdx = [...p.secondary.evidenceIdx[cat]].sort((a,b)=>a-b);
      const correctLabel = labelForKey(cat, p.secondary[cat].correct);
      if(p.selectedForStage2 && p.playerAnswer2){
        const placed = [...(p.playerAnswer2[cat]||[])].sort((a,b)=>a-b);
        const correct = isSortCorrect(placed, correctIdx);
        const chosenText = placed.length ? placed.map(i=>sentences[i]).join("。") : "（未選択＝該当なしとして回答）";
        secondaryHtml += `
        <div class="feedback" style="border-top:1px dashed var(--border);padding-top:14px;margin-top:14px;">
          <p class="path-title">${PAT_STAGE_LABELS[cat]}</p>
          <span class="verdict ${correct?'ok':'ng'}">${correct?"正解":"不正解"}</span>
          <p class="explain"><b>正しい判定：</b>${correctLabel}</p>
          ${!correct ? `<p class="explain"><b>あなたが選んだ文：</b>${chosenText}</p>` : ""}
          <p class="explain">${p.secondary[cat].explain}</p>
        </div>`;
      } else {
        secondaryHtml += `
        <div class="feedback" style="border-top:1px dashed var(--border);padding-top:14px;margin-top:14px;">
          <p class="path-title">${PAT_STAGE_LABELS[cat]}</p>
          <span class="verdict ng">未実施・不正解</span>
          <p class="explain">この患者は本来、二次トリアージが必要でした。<b>正しい判定：</b>${correctLabel}</p>
          <p class="explain">${p.secondary[cat].explain}</p>
        </div>`;
      }
    });
  }

  return `
  <div class="card" style="margin-bottom:14px;">
    <div class="card-body">
      <p class="case-label">患者${p.patientNum}（${p.scenario}）｜一次トリアージ</p>

  </div>`;
}

function buildPathTrailHtml(tag, path){
  if(!path) return "";
  return `
      <p class="path-title">たどった経路（START変法フローチャート）</p>
      <div class="path-trail">
        ${path.map((step,i)=> i===path.length-1
            ? `<span class="path-step path-alert tag-${tag}">${step}</span>`
            : `<span class="path-step">${step}</span>`
          ).join('<span class="path-arrow">↓</span>')}
        <span class="path-arrow">↓</span>
        <span class="path-step path-final tag-${tag}">${TAGS[tag].label}タグ（${TAGS[tag].num}）</span>
      </div>`;
}

function renderGame(){
  if(isScenarioMode(state.mode)) return renderScenarioGame();
  const c = currentCase();
  const isStart = c.kind === "start";
  const total = state.cases.length;

  const displayTag = isStart ? c.tag
    : (c.kind === "pat" && state.answered)
      ? (PAT_STAGE_ORDER.some(cat=>c[cat].correct !== NONE_KEY) ? "red" : "yellow")
      : null;

  let tabsHtml = "";
  if(isStart){
    const order = ["green","yellow","red","black"];
    tabsHtml = `<div class="tab-strip">` + order.map(t=>{
      let cls = "tab " + t;
      if(state.answered){
        if(t === c.tag) cls += " kept";
        else cls += " torn";
      }
      return `<div class="${cls}">${TAGS[t].label} ${TAGS[t].num}</div>`;
    }).join("") + `</div>`;
  } else {
    tabsHtml = `<div class="tab-strip">
      <div class="tab yellow ${state.answered && displayTag!=='yellow' ? 'torn':''} ${state.answered && displayTag==='yellow' ? 'kept':''}">黄 区分Ⅱ</div>
      <div class="tab red ${state.answered && displayTag!=='red' ? 'torn':''} ${state.answered && displayTag==='red' ? 'kept':''}">赤 区分Ⅰ</div>
    </div>`;
  }

  let bodyHtml = "";
  if(isStart){
    const order = ["green","yellow","red","black"];
    bodyHtml = `<p class="vignette">${c.vignette}</p>` + `<div class="answer-grid">` + order.map(t=>
      `<button class="ans-btn c-${t}" data-tag="${t}">${TAGS[t].label}タグ<span class="en">${TAGS[t].num}</span></button>`
    ).join("") + `</div>`;
  } else if(!state.answered){
    bodyHtml = renderSortInterface(c.vignette, PAT_STAGE_ORDER, "btn-pat-sort-submit", "採点する");
  } else {
    bodyHtml = `<p class="vignette">${c.vignette}</p>`;
  }

  let feedbackHtml = "";
  if(state.answered && isStart){
    const correct = state.selected === c.tag;
    const stampColor = `var(--tag-${displayTag})`;
    const stampText = `${TAGS[displayTag].label}タグ ${TAGS[displayTag].num}`;
    const pathTrailHtml = c.path ? buildPathTrailHtml(c.tag, c.path) : "";
    feedbackHtml = `
    <div class="feedback">
      <span class="verdict ${correct?'ok':'ng'}">${correct?"正解":"不正解"}${(state.selected===null)?"（時間切れ）":""}</span>
      <div>
        <span class="stamp" style="--stamp-color:${stampColor}">${stampText}</span>
      </div>
      <p class="explain">${c.explain}</p>
      ${pathTrailHtml}
      <button class="next-btn" id="btn-next">${(!state.endless && state.index+1>=total) ? "結果を見る" : "次の問題へ"}</button>
    </div>`;
  } else if(state.answered && c.kind === "pat"){
    const resultBlocks = state.lastTripletResult.map(r=>`
      <div class="feedback" style="border-top:1px dashed var(--border);padding-top:14px;margin-top:14px;">
        <p class="path-title">${PAT_STAGE_LABELS[r.sub]}</p>
        <span class="verdict ${r.correct?'ok':'ng'}">${r.correct?"正解":"不正解"}</span>
        <p class="explain"><b>正しい判定：</b>${r.correctLabel}</p>
        ${!r.correct ? `<p class="explain"><b>あなたが選んだ文：</b>${r.chosenText}</p>` : ""}
        <p class="explain">${r.explain}</p>
      </div>`).join("");
    feedbackHtml = `
    ${resultBlocks}
    <button class="next-btn" id="btn-next" style="margin-top:16px;">${(!state.endless && state.index+1>=total) ? "結果を見る" : "次の患者へ"}</button>`;
  }

  const patientPrefix = (c.kind === "pat" && c.compoundNum) ? `患者${c.compoundNum}／${c.compoundTotal}・` : "";
  const caseLabel = isStart ? "一次トリアージ・START法"
    : (state.answered && c.kind === "pat") ? `${patientPrefix}評価結果`
    : `${patientPrefix}二次トリアージ`;

  const topbarProgress = state.endless
    ? `<span class="endless-badge">ENDLESS</span><span>${state.index+1}問目</span><div class="progress-track" style="visibility:hidden;"></div>`
    : `<span>${state.index+1} / ${total}</span><div class="progress-track"><div class="progress-fill" style="width:${(state.index)/total*100}%"></div></div>`;

  return `
  <div class="game-topbar">
    ${topbarProgress}
    <span class="score-pill">正解 <b>${state.score}</b></span>
    <button class="quit-btn" id="btn-quit">${state.endless ? "終了" : "中止"}</button>
  </div>
  ${isStart ? `<div class="timer-wrap"><div class="timer-fill" id="timer-fill"></div></div>` : ""}
  <div class="card">
    ${tabsHtml}
    <div class="card-body">
      <p class="case-label">${caseLabel}</p>
      ${bodyHtml}
      ${feedbackHtml}
    </div>
  </div>`;
}

function renderResult(){
  const total = state.score + state.mistakes.length;
  const pct = total === 0 ? 0 : Math.round(state.score/total*100);
  let tier, msg;
  if(total === 0){ tier="記録なし"; msg="まだ1問も回答されていません。"; }
  else if(pct === 100){ tier="エキスパート判定"; msg="全問正解です。実際の災害現場でも自信を持って一次・二次トリアージにあたれるレベルです。"; }
  else if(pct >= 80){ tier="上級レベル"; msg="ほぼ正確に判定できています。間違えた症例だけ復習しておきましょう。"; }
  else if(pct >= 50){ tier="中級レベル"; msg="基本的な流れはつかめています。フローチャートを見直してもう一度挑戦してみましょう。"; }
  else { tier="訓練生レベル"; msg="まずは「フローチャート確認」で判定基準を見直してから、再挑戦してみましょう。"; }

  const mistakesHtml = state.mistakes.length === 0
    ? `<p class="intro-note">間違えた症例はありませんでした。</p>`
    : state.mistakes.map(m=>`
      <div class="review-item">
        <div class="ri-top">
          <span>正解：${m.correctLabel}</span>
          <span>あなたの回答：${m.chosenLabel}</span>
        </div>
        <p style="margin:0 0 6px;">${m.vignette}</p>
        <p style="margin:0;color:var(--muted);">${m.explain}</p>
      </div>`).join("");

  return `
  <div class="result-hero">
    <div class="big-score">${state.score}<span>/${total}</span></div>
    <p class="result-tier">${tier}</p>
    <p class="result-msg">${msg}</p>
  </div>
  ${mistakesHtml}
  <div class="result-actions">
    <button class="btn-secondary" id="btn-select">モード選択に戻る</button>
    <button class="next-btn" id="btn-retry">同じモードでもう一度</button>
  </div>`;
}

function renderRefModal(){
  return `
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-sheet">
      <button class="modal-close" id="modal-close">閉じる ×</button>
      <h2>START法（一次トリアージ）</h2>
      <p class="sub">歩行 → 呼吸 → 循環 → 意識　の順に、約30秒で判定します。</p>
      <div class="flow-step"><div class="fs-num">1</div><div class="fs-body"><b>歩行可能？</b><span class="arrow">はい → <span class="tag-chip green">緑</span>／いいえ → 次へ</span></div></div>
      <div class="flow-step"><div class="fs-num">2</div><div class="fs-body"><b>自発呼吸は？</b><span class="arrow">なし→気道開放にて呼吸なし → <span class="tag-chip black">黒</span>／気道開放にて呼吸あり → <span class="tag-chip red">赤</span>／もともとあり → 次へ</span></div></div>
      <div class="flow-step"><div class="fs-num">3</div><div class="fs-body"><b>呼吸回数は？</b><span class="arrow">9回/分以下 or 30回/分以上 → <span class="tag-chip red">赤</span>／10〜29回/分 → 次へ</span></div></div>
      <div class="flow-step"><div class="fs-num">4</div><div class="fs-body"><b>橈骨動脈は触知できるか？</b><span class="arrow">触知せず → <span class="tag-chip red">赤</span>／触知可能 → 次へ</span></div></div>

      <h2 style="margin-top:24px;">PAT法（二次トリアージ）</h2>
      <p class="sub">START法で黄タグとなった傷病者を、第1段階（生理学的評価）→ 第2段階（解剖学的評価）→ 第3段階（受傷機転）の順にじっくり再評価します。いずれかに該当すれば赤タグへ格上げします。</p>
      <div class="pat-rule">
        <b>第1段階：生理学的評価</b>
        <ul>
          <li>意識：呼びかけへの反応がない、または不穏（JCS2桁以上）</li>
          <li>気道：舌根沈下、気道閉塞</li>
          <li>呼吸：浅く速い・深く遅い・不規則、左右差、30回/分以上または9回/分以下、SpO2 90%未満</li>
          <li>循環：橈骨動脈が触れない・弱い・速い、蒼白・冷感・湿潤、活動性出血、脈拍120以上/50未満、血圧90未満/200以上</li>
          <li>体温：35℃以下</li>
        </ul>
      </div>
      <div class="pat-rule">
        <b>第2段階：解剖学的評価（身体所見 → 疑われる病態）</b>
        <ul>
          <li>開放創を伴う頭蓋骨の変形 → （開放性）頭蓋骨骨折</li>
          <li>髄液鼻漏・髄液耳漏 → 頭蓋底骨折</li>
          <li>顔面熱傷・鼻毛焼灼・口鼻腔内すす付着・嗄声 → 顔面、気道熱傷</li>
          <li>頸部皮下気腫＋気管変形 → 緊張性気胸、気管・気道損傷</li>

          <li>気管偏位 → 緊張性気胸、気管・気道損傷</li>
          <li>皮下気腫 → 気胸、気管・気管支損傷</li>
          <li>呼吸音左右差（患側減弱） → 血気胸</li>
          <li>胸郭動揺・奇異呼吸 → フレイルチェスト</li>
          <li>胸部創より気泡混じりの出血 → 開放性気胸</li>
          <li>腹部膨隆・腹壁緊張・腸管脱出 → 腹腔内出血、腹部臓器損傷</li>
          <li>骨盤圧痛・動揺・下肢長差 → 骨盤骨折</li>
          <li>大腿の変形・出血・腫脹・圧痛・下肢長差 → 両側大腿骨骨折</li>
          <li>四肢麻痺・奇異（腹式）呼吸 → 上位脊髄損傷</li>
          <li>四肢軟部組織剥脱 → デグロービング損傷</li>
          <li>重量物挟まれ・下敷き、ポートワイン尿 → 圧挫症候群（クラッシュシンドローム）</li>
          <li>頭頸部・体幹部・そけい部への穿通性外傷 → 重要臓器損傷、大血管損傷</li>
          <li>四肢の切断 → 専門医の治療を要する切断肢</li>
          <li>外傷を伴う15%以上の熱傷、ショックを伴う広範囲熱傷 → 専門医の治療を要する重症熱傷</li>
        </ul>
      </div>
      <div class="pat-rule">
        <b>第3段階：受傷機転</b>
        <ul>
          <li>体幹部の挟圧</li>
          <li>1肢以上の挟圧（4時間以上）</li>
          <li>高所墜落</li>
          <li>爆発</li>
          <li>異常温度環境</li>
          <li>有毒ガス発生</li>
          <li>汚染（NBC）</li>
        </ul>
      </div>
    </div>
  </div>`;
}

/* ============================= EVENTS ============================= */

function bindEvents(){
  const refBtn = document.getElementById("btn-ref");
  if(refBtn) refBtn.onclick = ()=>{ state.showRef = true; render(); };

  const feedbackBtn = document.getElementById("btn-feedback");
  if(feedbackBtn) feedbackBtn.onclick = ()=>{ window.open(FEEDBACK_URL, "_blank", "noopener"); };

  const modalClose = document.getElementById("modal-close");
  if(modalClose) modalClose.onclick = ()=>{ state.showRef = false; render(); };
  const overlay = document.getElementById("modal-overlay");
  if(overlay) overlay.onclick = (e)=>{ if(e.target === overlay){ state.showRef=false; render(); } };

  const quitBtn = document.getElementById("btn-quit");
  if(quitBtn) quitBtn.onclick = ()=>{ state.showQuit = true; render(); };

  const quitCancel = document.getElementById("btn-quit-cancel");
  if(quitCancel) quitCancel.onclick = ()=>{ state.showQuit = false; render(); };

  const quitConfirm = document.getElementById("btn-quit-confirm");
  if(quitConfirm) quitConfirm.onclick = quitSession;

  const quitOverlay = document.getElementById("quit-overlay");
  if(quitOverlay) quitOverlay.onclick = (e)=>{ if(e.target === quitOverlay){ state.showQuit = false; render(); } };

  document.querySelectorAll(".mode-card").forEach(btn=>{
    btn.onclick = ()=> startMode(btn.dataset.mode);
  });

  document.querySelectorAll(".ans-btn").forEach(btn=>{
    btn.onclick = ()=>{
      if(isScenarioMode(state.mode) && state.scenarioPhase === "triage1"){
        answerTriage1(btn.dataset.tag);
      } else {
        selectAnswer(btn.dataset.tag);
      }
    };
  });

  document.querySelectorAll(".seg").forEach(el=>{
    el.onclick = ()=> pickUpSentence(parseInt(el.dataset.i,10));
  });
  document.querySelectorAll(".zone-chip").forEach(el=>{
    el.onclick = ()=> pickUpSentence(parseInt(el.dataset.i,10));
  });
  document.querySelectorAll(".drop-zone").forEach(el=>{
    el.onclick = (e)=>{
      if(e.target.closest(".zone-chip")) return;
      placeSentence(el.dataset.zone);
    };
  });
  const sortVignette = document.getElementById("sort-vignette");
  if(sortVignette) sortVignette.addEventListener("click", (e)=>{
    if(e.target.closest(".seg")) return;
    placeSentence(null);
  });
  const patSortSubmit = document.getElementById("btn-pat-sort-submit");
  if(patSortSubmit) patSortSubmit.onclick = submitPatSort;
  const scenarioSortSubmit = document.getElementById("btn-scenario-sort-submit");
  if(scenarioSortSubmit) scenarioSortSubmit.onclick = submitScenarioSort;

  document.querySelectorAll(".patient-card").forEach(btn=>{
    btn.onclick = ()=> tapPatient(parseInt(btn.dataset.boardIdx,10));
  });

  const triage2Ack = document.getElementById("btn-triage2-ack");
  if(triage2Ack) triage2Ack.onclick = acknowledgeNoSecondary;

  const gradeBtn = document.getElementById("btn-scenario-grade");
  if(gradeBtn) gradeBtn.onclick = enterReview;

  const reviewNext = document.getElementById("btn-review-next");
  if(reviewNext) reviewNext.onclick = ()=>{
    state.screen = "result";
    render();
  };

  const nextBtn = document.getElementById("btn-next");
  if(nextBtn) nextBtn.onclick = nextCase;

  const selectBtn = document.getElementById("btn-select");
  if(selectBtn) selectBtn.onclick = backToSelect;

  const retryBtn = document.getElementById("btn-retry");
  if(retryBtn) retryBtn.onclick = ()=> startMode(state.mode);
}

render();
</script>
</body>
</html>
